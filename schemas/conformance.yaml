# Maps each schema to the files it governs, for
# scripts/validate_data_conformance.py. validate_schemas.py checks the
# schema files themselves; this file is what makes them constrain the
# data they describe.
version: 1
mappings:
  - schema: mcp-surface-diff.schema.json
    # The synthetic producer fixture keeps this mapping exercised offline.
    # Runtime reports are also validated whenever the live drift gate emits them.
    files: ["examples/mcp-surface-diff.*.json", "reports/mcp-surface-diff.*.json"]
    records: self
